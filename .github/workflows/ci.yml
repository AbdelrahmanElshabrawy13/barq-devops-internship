name: DevOps CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Compose Config
        run: docker compose config

      - name: Build and Start Environment
        run: docker compose up -d --build

      - name: Wait for Service Readiness
        run: |
          echo "Waiting for services to report ready..."
          timeout 45s bash -c 'until curl -sf http://localhost:8080/ready; do sleep 2; done'

      - name: Run System Validation Suite
        run: python3 validate.py

      - name: Run Failover Test
        run: python3 failure_test.py

      - name: Teardown Environment
        if: always()
        run: docker compose down -v
